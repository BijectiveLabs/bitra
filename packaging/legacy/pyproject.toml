# The package's name before 0.10.1. It installs bitra at the same version and nothing else, so
# `pip install trading-research-agents` and old instructions keep working. Released with bitra,
# at the same version; tests/test_legacy_package.py holds the two together.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trading-research-agents"
version = "0.10.1"
description = "Renamed to bitra (TRA). This package installs bitra; the command is still tra."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bijective Labs" }]
dependencies = ["bitra==0.10.1"]

[project.optional-dependencies]
anthropic = ["bitra[anthropic]==0.10.1"]
ccxt = ["bitra[ccxt]==0.10.1"]
data = ["bitra[data]==0.10.1"]
google = ["bitra[google]==0.10.1"]
mcp = ["bitra[mcp]==0.10.1"]
openai = ["bitra[openai]==0.10.1"]
shadow = ["bitra[shadow]==0.10.1"]

[project.urls]
Homepage = "https://www.bijectivelabs.dev/open-source"
Documentation = "https://docs.bijectivelabs.dev/opensource/"
Package = "https://pypi.org/project/bitra/"

[tool.hatch.build.targets.wheel]
bypass-selection = true
