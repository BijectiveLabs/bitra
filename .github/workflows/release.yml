name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build and attach
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      - name: Checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest

      - name: Build
        run: |
          uv build
          # The old name, which installs bitra at the same version: old instructions keep working.
          uv build packaging/legacy --out-dir dist

      - name: Tag matches the package version
        run: |
          expected="v$(uv run python -c 'import trading_research_agents as t; print(t.__version__)')"
          test "${GITHUB_REF_NAME}" = "${expected}" || { echo "tag ${GITHUB_REF_NAME} is not ${expected}"; exit 1; }

      - name: Keep the built files for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for ${GITHUB_REF_NAME}."

  # PyPI through trusted publishing: no token is stored anywhere. It runs only where the variable
  # PUBLISH_TO_PYPI is "true", so a tag pushed in a fork makes a GitHub release and nothing else.
  # The files published are the ones the checks above passed on, not a second build. No
  # deployment environment, because the trusted publisher on PyPI is registered without one.
  publish:
    name: publish to PyPI
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Publish
        run: uv publish --trusted-publishing always dist/*

  # The MCP Registry entry, after PyPI: the registry checks that the version in server.json is on
  # PyPI and that its README names the server. GitHub OIDC proves the namespace, so no token is
  # stored. The publisher is pinned and checked against the checksum its release published.
  registry:
    name: publish to the MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISHER: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v7

      - name: Install the publisher
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Wait for the version on PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 30); do
            curl -sSf "https://pypi.org/pypi/bitra/${version}/json" >/dev/null && exit 0
            sleep 10
          done
          echo "bitra ${version} is not on PyPI after five minutes"
          exit 1

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
