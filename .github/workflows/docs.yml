name: docs

on:
  push:
    branches: [master]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci
        working-directory: docs

      - name: Build
        run: npm run build
        working-directory: docs

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master'
        with:
          path: docs/.vitepress/dist

  # Deploys only where the variable PAGES_ENABLED is "true", so a fork builds and checks the site
  # without trying to publish it.
  deploy:
    name: deploy
    if: github.ref == 'refs/heads/master' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # IndexNow tells Bing, Yandex and the other engines that take it which pages changed, so they
      # are crawled within hours. Google does not take it and reads the sitemap from robots.txt.
      - name: Notify search engines
        continue-on-error: true
        env:
          SITE: https://docs.bijectivelabs.dev
          KEY: c501f126290de4b6f7310d7cbc3a4678
        run: |
          urls=$( { curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//'; echo "$SITE/llms.txt"; } | jq -R . | jq -sc .)
          jq -n --arg host "${SITE#https://}" --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}' |
            curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
              --data @- -o /dev/null -w "IndexNow answered %{http_code}\n"
