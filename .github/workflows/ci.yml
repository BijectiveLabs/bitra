name: ci

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  install:
    name: bare install of the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      # No extras, no dev tools: what `pip install trading-research-agents` gives a client.
      # Catches a runtime import that only works because a dev extra happened to be present.
      - name: Install into an empty environment and run the command
        run: |
          uv venv /tmp/bare
          uv pip install --python /tmp/bare/bin/python dist/*.whl
          /tmp/bare/bin/tra --version
          /tmp/bare/bin/tra --plain
          /tmp/bare/bin/tra init /tmp/proj
          cd /tmp/proj && /tmp/bare/bin/tra check || test $? -eq 1
          /tmp/bare/bin/python -c "import trading_research_agents, trading_research_agents.cli.main"

      # The commands a new client types first, with no extras and then with the quick start's
      # extras. A missing extra may refuse; it may not crash.
      - name: Client commands, bare install
        run: python scripts/client_smoke.py /tmp/bare/bin/tra /tmp/smoke-bare

      - name: Client commands, quick start install
        run: |
          uv venv /tmp/quick
          wheel=$(ls dist/*.whl)
          uv pip install --python /tmp/quick/bin/python "trading-research-agents[ccxt,openai,data] @ file://$PWD/$wheel"
          python scripts/client_smoke.py /tmp/quick/bin/tra /tmp/smoke-quick

  audit:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Audit the lock against OSV
        run: uv audit --locked --preview-features audit-command

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t tra .

      - name: Run
        run: |
          docker run --rm tra --version
          docker run --rm tra --plain

      # The image Glama builds from glama.json: it has to start and answer MCP introspection.
      - name: MCP server image
        run: |
          docker build -f glama/Dockerfile -t tra-mcp .
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          } | timeout 60 docker run -i --rm tra-mcp > answers.jsonl
          grep -q '"serverInfo"' answers.jsonl
          grep -q '"cost_floor_check"' answers.jsonl
