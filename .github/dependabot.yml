version: 2
# Version updates once a month, grouped, at most two open at a time; security updates do not wait for
# this schedule and arrive as soon as an advisory is published.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: ["dependencies"]
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: ["dependencies"]
    open-pull-requests-limit: 2
    groups:
      # Minor and patch releases together; a major version arrives on its own so its changelog is
      # read before it is merged.
      minor-and-patch:
        update-types: ["minor", "patch"]
