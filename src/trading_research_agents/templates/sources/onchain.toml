# On-chain series this desk reads: dated chain figures. Venue flows, supply held by cohorts, active
# addresses, whatever your provider gives you and you trust.
#
# The point of a file per class is that the vendor is a line, not a format. A free public endpoint
# you export by hand and a paid subscription you dump nightly are declared the same way here, and
# the on-chain analyst cannot tell which is which. That is deliberate: it keeps the desk portable
# when a free tier dies or a subscription starts.
#
# publish_lag matters more here than anywhere else: chain aggregates are usually published hours
# after the blocks they describe, and a figure used before it was knowable is a look-ahead.

# Nothing is switched on yet. Uncomment an entry, put the file where it points, and the on-chain
# analyst joins the roster on the next run. Left as it is, that role is not asked at all.

