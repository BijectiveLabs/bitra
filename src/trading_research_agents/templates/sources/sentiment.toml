# Sentiment series this desk reads: dated scores. A fear index, a positioning survey, a score your
# own model produces. Numbers with dates, nothing else.
#
# Dated text belongs in news.toml, not here. They are different shapes and they are read by
# different parts of the system: a score goes through the series engine and gets a threshold and a correlation, a
# headline goes through the calendar reader and keeps its words.
#
# With nothing declared here, the sentiment reading says "not declared" rather than "neutral".
# Those are different facts and the reports keep them apart.

# Each entry takes the same fields as macro.toml, including max_age, fetch and refresh; see there.

# Nothing is switched on yet. Uncomment an entry, put the file where it points, and the
# sentiment reading joins the roster on the next run.

# [[series]]
# name = "fear_greed"
# file = "sentiment/fear_greed.csv"     # columns: date,value  (0 to 100)
# ts = "date"
# ts_unit = "iso8601"
# value = "value"
# unit = "index"
# publish_lag = "0s"
# source = "alternative.me Crypto Fear & Greed Index"
# max_age = "2d"                        # a daily index; two days without one is a broken feed
# fetch = { from = "alternative.me" }
# threshold = { bullish_above = 60, bearish_below = 25 }
