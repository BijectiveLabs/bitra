# Dated text this desk reads: releases, policy statements, the notes you write yourself. Declared
# here, read by the macro analyst as events and by the sentiment analyst as notes.
#
# Each entry names a file of dated rows:
#
#   when,what[,source]
#   2026-09-26T12:30:00+00:00,policy statement, no change,central bank
#
# `when` carries a timezone or is a bare date. A file can also be fetched into: an RSS or Atom
# feed, or a JSON news API (fetch = { from = "http", url, rows, ts, text, source, key_env, ... }).
# Headlines are merged into the file as plain lines, kept for `keep` (7d) and refreshed every
# `refresh` (15m) by `tra run`. Fetch only what the service's terms allow.

# Nothing is switched on yet. Uncomment an entry and put the file where it points; the macro and
# sentiment analysts both read this class.

