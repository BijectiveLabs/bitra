# An operating envelope. Every figure here belongs to the operator, not to the market.
# Fees are per side in basis points, as quoted for the declared tier. Round trip = entry + exit.
# measured_round_trip_bps is optional: what execution actually cost end to end, when known.
#
# The name is not decoration: <entry>-<exit>, each maker or taker. It is what the two fees mean,
# and in venue mode it is how the order is sent - a maker entry rests on the book as a post-only
# limit, a taker entry crosses it. gas_quote is optional and for chains that charge settlement
# separately: a fixed cost in quote currency per round trip, priced as its own component.

[envelope]
order_latency_ms = 5.5

[[channel]]
venue = "bybit"
name = "taker-taker"
entry_fee_bps = 5.5
exit_fee_bps = 5.5
measured_round_trip_bps = 15.02
# [channel.spot]                # the spot pair's fees on the same channel, for a desk that
# entry_fee_bps = 10             # lists spot in [execution].markets; a spot pair usually costs
# exit_fee_bps = 10              # more than the perpetual on the same coin

[[channel]]
venue = "bybit"
name = "maker-taker"
entry_fee_bps = 2.0
exit_fee_bps = 5.5

# Hyperliquid's own fees. ccxt's 1 bp builder fee is off by default; a desk that turns it on
# in [execution].ccxt_options adds 1 bp to each side here (docs: Venues, Broker tags).
[[channel]]
venue = "hyperliquid"
name = "taker-taker"
entry_fee_bps = 4.5
exit_fee_bps = 4.5

[[channel]]
venue = "hyperliquid"
name = "maker-taker"
entry_fee_bps = 1.5
exit_fee_bps = 4.5

[[channel]]
venue = "hyperliquid"
name = "maker-maker"
entry_fee_bps = 1.5
exit_fee_bps = 1.5

# A chain where settlement is paid rather than netted out of the fee. The gas is the operator's
# own figure for a round trip, and the gate prices it against the notional like everything else.
# [[channel]]
# venue = "some-dex"
# name = "taker-taker"
# entry_fee_bps = 3.0
# exit_fee_bps = 3.0
# gas_quote = 1.40

# A prediction venue, for a desk that lists "prediction" in [execution].markets. Its outcome
# fee is not a flat rate on most venues; say how it is charged:
# [[channel]]
# venue = "kalshi"
# name = "taker-taker"
# entry_fee_bps = 0
# exit_fee_bps = 0
#
# [channel.prediction]
# fee_coefficient = 0.07           # 0.07 x shares x price x (1 - price)
