# A run of the trading agent, declared once. Nothing in here is a constant inside the logic.

[strategy]
file = "strategies/trailing_zscore.py"            # an example, not a recommendation
class = "TrailingZScore"
# import = "your_package.module:YourStrategy"      # or a core installed as a package
# registration_seal = "<64-character seal of the pre-registration this strategy implements>"

[strategy.params]
lookback = 60
entry_z = 2.0
exit_z = 0.5

[exit]
stop_sigma_frac = 0.01             # 1 percent of price, on the adverse side
take_profit_sigma_frac = 0.02
timeout_bars = 240
mechanism_bound = "The dislocation the core trades resolves within a few hours; past that the mechanism is gone."
slip_bps = 5.0

[run]
instrument = "BTCUSDT"
venue_key = "bybit/taker-taker"    # a channel declared in envelope.toml
bar_interval_s = 60
size = 0.01
spread_cost_bps = 3.0              # half-spread from the recorded book, declared here
equity = 10000                     # in quote currency; leave out and every entry is refused
latency_ms = 6                     # measured order round trip on a persistent connection
slippage_bps = 1.0
settlement_interval_s = 28800      # the venue's funding clock
# funding = "funding.json"         # from `tra data funding`; absent means no settlement spanned

[controls]
max_risk_per_trade_bps = 50
max_position = 0.05
max_orders_per_minute = 6
daily_loss_limit_bps = 300
kill_switch = "KILL"               # touch this file to flatten and stop

# ---- live tier (T3 canary). Keys never live here: BYBIT_API_KEY / BYBIT_API_SECRET come from
# the environment or `--env-file`. Uncomment both tables to run `tra live`.
# [live]
# venue = "bybit"                  # a live venue plugin; defaults to the venue half of venue_key
# environment = "demo"             # demo | testnet | mainnet
# key_ip_unbound_ok = false        # accept a key with no IP binding, deliberately
# adopt_open_position = false      # take over a position the venue already holds, deliberately
# poll_interval_ms = 250

# [canary]
# max_notional = 200               # per order, in quote currency
# max_round_trips = 5
# session_loss_limit_bps = 100
# max_session_minutes = 120

# ---- the technical analyst as the core instead of a code core (docs/agents.md). Replace the
# [strategy] table with `agent = "technical_analyst"` and declare the budget:
# [agents]
# provider = "deepseek"            # any registered provider (docs/providers.md)
# model = "deepseek-flash"
# mechanism = "positions forced to close into the settlement window"
# token_budget = 200000            # the whole session, every role
# max_calls_per_hour = 60
# min_interval_s = 60
# lookback_bars = 60
# min_confidence = 0.6
# decide_every_bars = 5           # ask every fifth bar; exits still run on every bar
# max_output_tokens = 512         # caps a reasoning model's thinking, most of its latency
# call_timeout_s = 60             # per request; the SDK retries 429s and 5xx with backoff
# max_retries = 2
#
# The roster, when you want to say it outright. Left out, a cycle asks the technical analyst and
# whichever reading analysts have something declared on the shelf: sources/macro.toml,
# sources/onchain.toml, sources/derivatives.toml, sources/sentiment.toml, sources/news.toml.
# analysts = ["technical_analyst", "macro_analyst", "sentiment_analyst"]
#
# The stances that argue about a proposal once there is one. Each stance is one more call, so this
# is off until you ask for it. Pro argues for, contra argues against, neutral weighs both. Every
# claim they make has to cite a figure from the brief with its value, and code throws away the ones
# that do not: a verdict with no surviving claim becomes abstain.
# validators = ["pro", "contra", "neutral"]
#
# A role that only reads and labels does not need the model that reasons over sixty bars, and the
# difference is most of a token bill. Anything a role does not override it inherits from [agents].
# [agents.roles.sentiment_analyst]
# provider = "groq"
# model = "a-cheaper-model"
# max_output_tokens = 2048        # a reasoning model spends most of its output thinking, and the
#                                 # thinking is what varies: give it about twice what it needs
# [agents.pricing.deepseek-flash]  # what the operator was quoted; never a constant
# input_per_million = 0.14
# output_per_million = 0.28

# ---- the two gates you declare and code applies. Both are off as shipped: uncomment to use them.
#
# Does the context agree with the direction? The states here are the ones your own thresholds
# produced in sources/*.toml, not the words a model wrote. A required role that produced no state
# has agreed to nothing, and the cycle refuses: that is what on_missing = "refuse" means. Set it to
# "ignore" if you mean to run on one leg, and the record will say you did.
# [confluence]
# required = ["macro_analyst", "onchain_analyst"]
# long_states = ["bullish"]        # what a long needs from each required role
# short_states = ["bearish"]
# on_missing = "refuse"            # refuse | ignore
# min_support = 1                  # validators that must support it (needs [agents].validators)
# max_opposition = 0               # validators that may oppose it; 0 is the strictest there is
#
# Is this the trade you said you wanted? Trading, not investing: what it has to be worth, and how
# often you are willing to do it. The round trips are counted from the intents already on disk, so
# a restarted process cannot forget what it has already done today.
# [targets]
# min_net_bps = 5                  # what must be left of the edge after every cost the gate priced
# min_reward_risk = 1.5            # take profit against stop, both from [exit]
# max_round_trips_per_day = 6

[data]
max_gap = "5m"                     # the longest silence the audit accepts for this instrument
