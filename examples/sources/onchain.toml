# On-chain series this desk reads: dated chain figures. Venue flows, supply held by cohorts, active
# addresses, whatever your provider gives you and you trust.
#
# The point of a file per class is that the vendor is a line, not a format. A free public endpoint
# you export by hand and a paid subscription you dump nightly are declared the same way here, and
# the on-chain analyst cannot tell which is which. That is deliberate: it keeps the desk portable
# when a free tier dies or a subscription starts.
#
# publish_lag matters more here than anywhere else: chain aggregates are usually published hours
# after the blocks they describe, and a figure used before it was knowable is a look-ahead.

# A paid subscription is one fetch line. Presets carry the vendor's address and where its key goes:
#   { from = "glassnode", id = "transactions/transfers_volume_exchanges_net",
#     params = { a = "BTC", i = "1h" } }                                  GLASSNODE_API_KEY
#   { from = "cryptoquant", id = "btc/exchange-flows/netflow",
#     params = { exchange = "...", window = "hour" }, value = "netflow_total" }  CRYPTOQUANT_API_KEY
#   { from = "arkham", id = "...", rows = "...", ts = "...", value = "..." }   ARKHAM_API_KEY
# Anything else is { from = "http", url = "https://...", ... } with the path, the field names and
# the key's place taken from your vendor's docs (macro.toml lists the fields).
# Set max_age to what the vendor actually delivers, so a feed that stops is noticed, not trusted.

# Two free feeds need no key: Coin Metrics community (many assets; exchange flows, active
# addresses, supply) and Blockchain.com charts (Bitcoin). The first two entries below use Coin
# Metrics and fill their own files; set the lines from your own look at the history.

# Nothing is switched on yet. Uncomment an entry, put the file where it points, and the on-chain
# analyst joins the roster on the next run. Left as it is, that role is not asked at all.

