# A run of the trading agent, declared once. Nothing in here is a constant inside the logic.

[strategy]
file = "examples/strategies/trailing_zscore.py"   # an example, not a recommendation
class = "TrailingZScore"
# import = "your_package.module:YourStrategy"      # or a core installed as a package
# registration_seal = "<64-character seal of the pre-registration this strategy implements>"

[strategy.params]
lookback = 60
entry_z = 2.0
exit_z = 0.5

[exit]
stop_sigma_frac = 0.01             # 1 percent of price, on the adverse side
take_profit_sigma_frac = 0.02
timeout_bars = 240
mechanism_bound = "The dislocation the core trades resolves within a few hours; past that the mechanism is gone."
slip_bps = 5.0

[run]
instrument = "BTCUSDT"
venue_key = "bybit/taker-taker"    # a channel declared in envelope.toml
bar_interval_s = 60
size = 0.01
spread_cost_bps = 3.0              # half-spread from the recorded book, declared here
equity = 10000                     # in quote currency; leave out and every entry is refused
latency_ms = 6                     # measured order round trip on a persistent connection
slippage_bps = 1.0
settlement_interval_s = 28800      # the venue's funding clock

[controls]
max_risk_per_trade_bps = 50
max_position = 0.05
max_orders_per_minute = 6
daily_loss_limit_bps = 300
kill_switch = "KILL"               # touch this file to flatten and stop
