[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "trading-research-agents"
version = "0.6.7"
description = "An autonomous trading system for crypto. The agents propose; tested rules decide."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bijective Labs" }]
keywords = [
    "quant", "crypto", "trading", "agents", "llm", "perpetuals", "autonomous", "backtest", "risk",
    "algorithmic-trading", "trading-bot", "ai-agents", "llm-agents", "ccxt", "risk-management",
    "mcp", "openai", "anthropic", "gemini", "groq", "ollama",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "prompt-toolkit>=3.0",
    "rich>=13",
]

[project.scripts]
tra = "trading_research_agents.cli:main"

[project.urls]
Homepage = "https://www.bijectivelabs.dev/open-source"
Documentation = "https://docs.bijectivelabs.dev"
Repository = "https://github.com/BijectiveLabs/trading-research-agents"
Issues = "https://github.com/BijectiveLabs/trading-research-agents/issues"
Changelog = "https://github.com/BijectiveLabs/trading-research-agents/blob/master/CHANGELOG.md"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1",
]
ccxt = [
    "ccxt>=4.5",
]
data = [
    "pyarrow>=18",
]
google = [
    "google-genai>=1",
]
mcp = [
    "mcp>=2,<3",
]
openai = [
    "openai>=1",
]
shadow = [
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.14",
    "ruff>=0.9",
]

[tool.uv]
# ccxt pins multidict exactly to a release with a published advisory; the lock (CI and every
# developer environment) takes the fixed release until ccxt moves its pin. Installs from PyPI follow
# ccxt's own pin, which is ccxt's to change.
override-dependencies = ["multidict>=6.9.1,<7"]  # aiohttp needs it below 7

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# GitHub shows the README's images from the repository itself; PyPI has no repository to read
# them from, so the published copy points each one at the file under this release's tag, which
# keeps an old version's page intact when a later one renames a picture.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src="|\]\()assets/'
replacement = '\1https://raw.githubusercontent.com/BijectiveLabs/trading-research-agents/v$HFPR_VERSION/assets/'

[tool.hatch.build.targets.wheel]
packages = ["src/trading_research_agents"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "RUF", "SIM", "S"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["trading_research_agents"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "ccxt",
    "ccxt.*",
    "pyarrow",
    "pyarrow.*",
    "anthropic",
    "anthropic.*",
    "openai",
    "openai.*",
    "websockets",
    "websockets.*",
    "google",
    "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
