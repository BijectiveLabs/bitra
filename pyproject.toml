[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trading-research-agents"
version = "0.6.0"
description = "Autonomous trading agents for crypto that can't fudge their own results."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bijective Labs" }]
keywords = ["quant", "crypto", "trading", "agents", "llm", "perpetuals", "autonomous", "backtest", "risk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "prompt-toolkit>=3.0",
    "rich>=13",
]

[project.scripts]
tra = "trading_research_agents.cli:main"

[project.urls]
Homepage = "https://bijectivelabs.dev"
Documentation = "https://docs.bijectivelabs.dev"
Repository = "https://github.com/BijectiveLabs/trading-research-agents"
Issues = "https://github.com/BijectiveLabs/trading-research-agents/issues"
Changelog = "https://github.com/BijectiveLabs/trading-research-agents/blob/master/CHANGELOG.md"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1",
]
ccxt = [
    "ccxt>=4.5",
]
data = [
    "pyarrow>=18",
]
google = [
    "google-genai>=1",
]
mcp = [
    "mcp>=2,<3",
]
openai = [
    "openai>=1",
]
shadow = [
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.14",
    "ruff>=0.9",
]

[tool.uv]
# ccxt pins multidict exactly to a release with a published advisory; the lock (CI and every
# developer environment) takes the fixed release until ccxt moves its pin. Installs from PyPI follow
# ccxt's own pin, which is ccxt's to change.
override-dependencies = ["multidict>=6.9.1,<7"]  # aiohttp needs it below 7

[tool.hatch.build.targets.wheel]
packages = ["src/trading_research_agents"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "RUF", "SIM", "S"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["trading_research_agents"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "ccxt",
    "ccxt.*",
    "pyarrow",
    "pyarrow.*",
    "anthropic",
    "anthropic.*",
    "openai",
    "openai.*",
    "websockets",
    "websockets.*",
    "google",
    "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
