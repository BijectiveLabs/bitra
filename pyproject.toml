[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "bitra"
version = "0.10.0"
description = "Autonomous trading agents with deterministic execution. The agents propose; the system decides."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bijective Labs" }]
keywords = [
    "quant", "crypto", "trading", "agents", "llm", "perpetuals", "spot", "prediction-markets",
    "autonomous", "backtest", "risk",
    "algorithmic-trading", "trading-bot", "ai-agents", "llm-agents", "ccxt", "risk-management",
    "mcp", "openai", "anthropic", "gemini", "groq", "ollama", "trading-agents", "deterministic",
    "execution", "trading-system",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "prompt-toolkit>=3.0",
    "rich>=13",
    # Windows ships no time zone database; the equity session is read in New York time.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
tra = "trading_research_agents.cli:main"
# The same command under the package's own name, which is what `uvx bitra` runs.
bitra = "trading_research_agents.cli:main"
# The command of releases before 0.10.1, kept while instructions and MCP hosts still name it.
trading-research-agents = "trading_research_agents.cli:main"

[project.urls]
Homepage = "https://www.bijectivelabs.dev/open-source"
Documentation = "https://docs.bijectivelabs.dev"
Repository = "https://github.com/BijectiveLabs/bitra"
Issues = "https://github.com/BijectiveLabs/bitra/issues"
Changelog = "https://github.com/BijectiveLabs/bitra/blob/master/CHANGELOG.md"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1",
]
ccxt = [
    "ccxt>=4.5",
]
data = [
    "pyarrow>=18",
]
google = [
    "google-genai>=1",
]
mcp = [
    "mcp>=2,<3",
]
openai = [
    "openai>=1",
]
# The public trade stream for `tra paper` and `tra live` is ccxt's, so this is the ccxt extra
# under the name the docs have always used for it.
shadow = [
    "ccxt>=4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.14",
    "ruff>=0.9",
]

[tool.uv]
# ccxt pins multidict and certifi exactly, to releases with published advisories; the lock (CI and
# every developer environment) takes the fixed releases until ccxt moves its pins. Installs from PyPI
# follow ccxt's own pins, which are ccxt's to change.
override-dependencies = [
    "multidict>=6.9.1,<7",  # aiohttp needs it below 7
    "certifi>=2026.10.19",  # PYSEC-2026-4320
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# GitHub shows the README's images from the repository itself; PyPI has no repository to read
# them from, so the published copy points each one at the file under this release's tag, which
# keeps an old version's page intact when a later one renames a picture.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src="|\]\()assets/'
replacement = '\1https://raw.githubusercontent.com/BijectiveLabs/bitra/v$HFPR_VERSION/assets/'

[tool.hatch.build.targets.wheel]
packages = ["src/trading_research_agents"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "RUF", "SIM", "S"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["trading_research_agents"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "ccxt",
    "ccxt.*",
    "pyarrow",
    "pyarrow.*",
    "anthropic",
    "anthropic.*",
    "openai",
    "openai.*",
    "google",
    "google.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
