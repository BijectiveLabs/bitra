[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trading-research-agent"
version = "0.4.1"
description = "A trading research agent that refuses to claim what its gates have not measured. Crypto-first."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bijective Labs" }]
keywords = ["quant", "research", "backtest", "crypto", "falsification", "trading-agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
tra = "trading_research_agent.cli:main"

[project.urls]
Repository = "https://github.com/BijectiveLabs/trading-research-agent"
Changelog = "https://github.com/BijectiveLabs/trading-research-agent/blob/master/CHANGELOG.md"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1",
]
data = [
    "pyarrow>=18",
]
openai = [
    "openai>=1",
]
shadow = [
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.14",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_research_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "RUF", "SIM", "S"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["trading_research_agent"]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "anthropic",
    "anthropic.*",
    "openai",
    "openai.*",
    "websockets",
    "websockets.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
